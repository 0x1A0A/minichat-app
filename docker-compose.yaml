services:
  mfe-user:
    build:
      context: ./mfe/Users/
      dockerfile: ../Dockerfile
      args:
        ARG_MFE_SERVER: "http://localhost:8080"
    ports:
      - 80

  mfe-room:
    build:
      context: ./mfe/Rooms/
      dockerfile: ../Dockerfile
      args:
        ARG_MFE_SERVER: "http://localhost:8080"
    ports:
      - 80
    environment:
      MFE_SERVER: "http://localhost:8080"

  mfe-chat:
    build:
      context: ./mfe/Chat/
      dockerfile: ../Dockerfile
      args:
        ARG_MFE_SERVER: "http://localhost:8080"
    ports:
      - 80

  mfe-host:
    build:
      context: ./mfe/Freetext/
      dockerfile: ../Dockerfile
      args:
        ARG_MFE_SERVER: "http://localhost:8080"
    ports:
      - 80

  ingress:
    image: nginx
    volumes:
      - ./mfe/mfe-prd-nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    depends_on:
      - mfe-user
      - mfe-room
      - mfe-chat
      - mfe-host
